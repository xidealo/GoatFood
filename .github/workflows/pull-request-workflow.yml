name: "Pull request workflow"
#Add last 3 cafe for lints
on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.event.pull_request.number }}-pull-request
  cancel-in-progress: true

jobs:
  setup:
    name: "Upload secrets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: "Decode google-services.json"
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
        run: echo "${GOOGLE_SERVICE_JSON}" > app/google-services.json
      - name: "Upload google-services.json"
        uses: actions/upload-artifact@v4
        with:
          name: google-services
          path: app/google-services.json
      - name: "Decode local.properties"
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          APP_METRICA_API_KEY: ${{ secrets.APP_METRICA_API_KEY }}
        run: |
          echo -e "RELEASE_STORE_FILE=$RELEASE_STORE_FILE" > local.properties
          echo -e "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> local.properties
          echo -e "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> local.properties
          echo -e "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> local.properties
          echo -e "APP_METRICA_API_KEY=$APP_METRICA_API_KEY" >> local.properties
      - name: "Upload local.properties"
        uses: actions/upload-artifact@v4
        with:
          name: local-properties
          path: local.properties

  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        flavor: [
                  "gustopub",
                  "estpoest",
                  "mimino" ]
    steps:
      - uses: actions/checkout@v5
      - name: "Set up Android build"
        uses: ./.github/actions/setup-android-build
      - name: "Download google-services.json"
        uses: actions/download-artifact@v5
        with:
          name: google-services
          path: ./app
      - name: "Download local.properties"
        uses: actions/download-artifact@v5
        with:
          name: local-properties
          path: .
      - name: "Assemble ${{ matrix.flavor }}"
        uses: ./.github/actions/run-gradle
        with:
          command: assemble${{ matrix.flavor }}Debug

  linter:
    name: "Linter"
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        linter: [ "lint", "ktLint" ]
        flavor: [
                  "usadba",
                  "gustopub",
                  "mimino"
        ]
    steps:
      - uses: actions/checkout@v5
      - name: "Set up Android build"
        uses: ./.github/actions/setup-android-build
      - name: "Download google-services.json"
        uses: actions/download-artifact@v5
        with:
          name: google-services
          path: ./app
      - name: "Download local.properties"
        uses: actions/download-artifact@v5
        with:
          name: local-properties
          path: .
      - name: "Lint ${{ matrix.flavor }}"
        if: ${{ matrix.linter == 'lint' }}
        uses: ./.github/actions/run-gradle
        with:
          command: lint${{ matrix.flavor }}Debug
      - name: "KtLint ${{ matrix.flavor }}"
        if: ${{ matrix.linter == 'ktLint' }}
        uses: ./.github/actions/run-gradle
        with:
          command: ktlint${{ matrix.flavor }}DebugSourceSetCheck

  test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
      - name: "Set up Android build"
        uses: ./.github/actions/setup-android-build
      - name: "Download google-services.json"
        uses: actions/download-artifact@v5
        with:
          name: google-services
          path: ./app
      - name: "Download local.properties"
        uses: actions/download-artifact@v5
        with:
          name: local-properties
          path: .
      - name: "Run unit tests"
        uses: ./.github/actions/run-gradle
        with:
          command: testAndroidHostTest :app:test
